# Fly.io 설정 — `fly launch --copy-config --no-deploy` 후 앱 이름만 바꿔 쓴다.
#   fly volumes create doas_data --region nrt --size 1
#   fly secrets set SAVE_SECRET=<바꾸지 않을 무작위 값>
#   fly deploy
app = "doas-game"
primary_region = "nrt"   # 도쿄(한국에서 가장 가까운 리전)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  ROOMS = "3"
  ROOM_CAPACITY = "20"

[mounts]
  source = "doas_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # 방 상태가 프로세스 메모리에 있으므로 머신은 항상 1대만 돈다
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2500

  [[http_service.checks]]
    interval = "30s"
    timeout = "4s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
