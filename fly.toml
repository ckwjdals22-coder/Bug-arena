# Fly.io 설정 — `fly launch --copy-config --no-deploy` 후 앱 이름만 바꿔 쓴다.
#   fly volumes create doas_data --region nrt --size 1
#   fly secrets set SAVE_SECRET=<바꾸지 않을 무작위 값>
#   fly deploy --ha=false
#
# 머신은 반드시 1대: 방 상태가 프로세스 메모리에 있어 2대면 '1번 방'이 둘로 갈라진다.
#   - 첫 배포는 `fly deploy --ha=false`(기본값은 머신 2대를 만든다). 이미 2대라면 `fly scale count 1`.
#   - `fly scale count` 를 1보다 크게 하지 않는다. 볼륨 1개 = 머신 1대라서 볼륨을 하나만 만들어 두면 안전장치가 된다.
#   - 그래도 같은 DATA_DIR 에 서버가 둘 뜨면 두 번째는 잠금(DATA_DIR/server.lock)을 보고 exit 1 한다.
app = "doas-game"
primary_region = "nrt"   # 도쿄(한국에서 가장 가까운 리전)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  ROOMS = "3"
  ROOM_CAPACITY = "20"
  # 비우면 같은 주소(https://<앱>.fly.dev 또는 연결한 도메인)에서 연 화면만 WebSocket 접속을 받는다.
  # 클라이언트를 다른 곳에 올렸다면 그 주소를 쉼표로: "https://play.example.com". '*' = 모든 사이트 허용
  ALLOWED_ORIGINS = ""
  # 게임 포털에 iframe 으로 올릴 때만: "'self' https://portal.example"
  # FRAME_ANCESTORS = "'self'"

[mounts]
  source = "doas_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # 방 상태가 메모리에 있으므로 멈추지 않는다(멈추면 접속 중인 방이 사라진다)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # 서버 자체 상한(MAX_CONNS = 방 수 × 정원 × 2 + 100 = 220)에 맞춘다
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 240

  # 저장(DATA_DIR)이 실패하는 동안 /healthz 는 503 을 돌려준다
  [[http_service.checks]]
    interval = "30s"
    timeout = "4s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
