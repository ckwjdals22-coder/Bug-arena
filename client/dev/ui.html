<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UI 하네스 — 도를 아십니까?</title>
    <style>
      /* 하네스 전용 디버그 바(게임 UI 가 아니다) */
      #devbar {
        position: fixed;
        left: 6px;
        top: 50%;
        z-index: 9999;
        transform: translateY(-50%);
        font: 600 11px/1.3 system-ui, sans-serif;
      }
      #devbar summary {
        width: 30px;
        height: 30px;
        border: 2px solid #241b35;
        border-radius: 50%;
        background: #fff;
        line-height: 26px;
        text-align: center;
        list-style: none;
        cursor: pointer;
      }
      #devbar summary::-webkit-details-marker {
        display: none;
      }
      #devbar .dev-list {
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 3px;
        max-width: 330px;
        max-height: 70vh;
        margin-top: 4px;
        padding: 6px;
        overflow: auto;
        border: 2px solid #241b35;
        border-radius: 8px;
        background: #fff;
        touch-action: pan-y;
      }
      #devbar a {
        padding: 3px 6px;
        border-radius: 5px;
        background: #f6ecd2;
        color: #241b35;
        text-decoration: none;
        white-space: nowrap;
      }
      #devbar a.on {
        background: #ffd23f;
      }
      #devbar a.opt {
        background: #e7e0ff;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="가짜 게임 화면"></canvas>
    <div id="ui"></div>
    <details id="devbar"></details>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
