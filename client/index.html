<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>도를 아십니까? — 교주 시뮬레이터</title>
    <meta name="description" content="수상한 교주가 되어 거리를 누비는 3D 멀티플레이 풍자 코미디. 모든 교단은 허구입니다." />
    <meta name="theme-color" content="#ffd23f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="도를 아십니까? (모르셔도 됩니다)" />
    <meta property="og:description" content="길에서 말 걸고 라면교 교주 되는 게임. 가입 없음, 전부 허구." />
    <meta property="og:image" content="/og.jpg" />
    <!-- og:image·og:url 은 빌드 때 PUBLIC_URL 을 주면 절대 주소로 바뀐다(vite.config.ts, docs/DEPLOY.md) -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="도를 아십니까? 게임 화면 위에 얹은 제목" />
    <meta property="og:site_name" content="도를 아십니까? — 교주 시뮬레이터" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 홈 화면에 추가: 아이콘은 tools/make-media.cjs --icons 로 그린다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="도를 아십니까" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>" />
    <!-- 실시간 서버 주소 등 런타임 설정(빌드 없이 수정 가능). docs/DEPLOY.md 참고 -->
    <script src="/config.js"></script>
    <style>
      /* 스크립트가 뜨기 전에 보이는 첫 화면(자바스크립트 없이도 '다시 시도'가 뜬다) */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(#8fd0f2, #ffe2c4);
        color: #241b35;
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
        text-align: center;
      }
      #boot b {
        font-size: 30px;
      }
      #boot i {
        width: 44px;
        height: 44px;
        border: 5px solid #241b35;
        border-top-color: #ffd23f;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot a {
        opacity: 0;
        color: #241b35;
        font-weight: 800;
        animation: boot-late 0.4s 12s forwards;
      }
      #boot small {
        position: absolute;
        bottom: 18px;
        left: 16px;
        right: 16px;
        font-size: 11.5px;
        opacity: 0.75;
      }
      /* 시작하지 못했을 때: 도는 고리를 멈추고 이유와 다시 시도 버튼을 보여 준다 */
      #boot.fail i {
        display: none;
      }
      #boot.fail span {
        max-width: 300px;
        padding: 0 16px;
        font-weight: 700;
        line-height: 1.5;
        word-break: keep-all;
      }
      #boot.fail a {
        opacity: 1;
        animation: none;
        padding: 10px 18px;
        border: 3px solid #241b35;
        border-radius: 999px;
        background: #ffd23f;
        text-decoration: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-late {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <b>도를 아십니까?</b>
      <span>4번 출구로 나가는 중…</span>
      <i></i>
      <a href="">오래 걸리나요? 다시 시도</a>
      <small>이 게임의 모든 교단·인물·교리는 허구이며 풍자 코미디입니다.</small>
    </div>
    <canvas id="game" tabindex="0" aria-label="게임 화면"></canvas>
    <div id="ui"></div>
    <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
    <!-- 시작하지 못했을 때의 안내(외부 파일: 인라인 스크립트 없이 두어 엄격한 CSP 에서도 동작한다) -->
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
