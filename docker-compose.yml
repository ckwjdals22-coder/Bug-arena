# 서버 한 대 배포 예시:  docker compose up -d --build
# 처음 실행 전 .env 를 만들고 APP_URL, APP_ENCRYPTION_KEY, CRON_SECRET, POSTGRES_PASSWORD 를 채우세요.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: namneun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: namneun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namneun -d namneun"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://namneun:${POSTGRES_PASSWORD}@db:5432/namneun?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://namneun:${POSTGRES_PASSWORD}@db:5432/namneun?schema=public
      ENABLE_INTERNAL_CRON: "1"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
